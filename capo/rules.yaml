# ============================================================
#  Regole del Capo
#  Ordine delle decisioni:
#   1. comando forzato all'inizio del messaggio (es. "@claude ...")
#   2. testo molto lungo  -> documenti_lunghi
#   3. richiesta di approfondimento -> agente più capace di quello precedente
#   4. parole chiave      -> categoria corrispondente
#   5. altrimenti il modello locale classifica la richiesta
# ============================================================

# Modello (alias LiteLLM) usato dal Capo per classificare: deve essere locale e gratuito
classificatore: locale-chat

# Nome del modello in Ollama usato per i lavori interni veloci (classificare, scrivere prompt visivi)
modello_locale_ollama: qwen3:4b-instruct-2507-q4_K_M

# Oltre questo numero di caratteri la conversazione va al modello per documenti lunghi
soglia_testo_lungo: 30000

# Ricerca sul web per TUTTI gli agenti (SearXNG in Docker, gratuito).
# Si attiva se: il messaggio contiene un link, inizia con @web, contiene una parola chiave,
# oppure il Capo valuta che servano informazioni aggiornate.
ricerca_web:
  attiva: true
  comando: "@web"
  max_caratteri: 12000        # materiale massimo passato all'agente
  parole_chiave: ["cerca su internet", "cerca online", "cerca sul web", "su internet", "ultime notizie",
                  "notizie di oggi", "di oggi", "aggiornato", "prezzo attuale", "quanto costa",
                  "risultati di", "meteo", "leggi questo sito", "apri questo link"]

# Approfondimento automatico: se chiedi di approfondire la risposta precedente,
# il Capo passa a un agente più capace (e rifà la ricerca web se era stata usata).
approfondimento:
  attivo: true
  max_lunghezza: 250          # solo messaggi brevi ("approfondisci", "spiegami meglio"...)
  parole_chiave: [approfondisci, approfondire, approfondiamo, approfondimento, "più nel dettaglio",
                  "più dettagli", "nel dettaglio", "in dettaglio", "spiega meglio", "spiegami meglio",
                  "dimmi di più", "dimmi qualcosa in più", "più a fondo", "entra nel dettaglio",
                  "analisi più completa", "risposta più completa", "sviluppa meglio"]
  # agente della risposta precedente -> agente per l'approfondimento
  scala:
    chat: ragionamento
    codice_semplice: codice_complesso
    ragionamento: codice_complesso
    documenti_lunghi: codice_complesso
  predefinita: ragionamento   # se non si capisce chi ha risposto prima

categorie:
  chat:
    agente: "💬 Locale"
    modello: locale-chat
    max_contesto_web: 3500
    costo: gratis
    descrizione: conversazione, domande e informazioni generiche, spiegazioni, cosa fa un progetto o una pagina web, riassunti brevi, traduzioni semplici, consigli
    comando: "@locale"

  codice_semplice:
    agente: "🧑‍💻 Coder locale"
    modello: locale-coder
    max_contesto_web: 3500
    costo: gratis
    descrizione: piccoli script, una funzione, correzioni rapide, HTML/CSS semplice, spiegare un pezzo di codice
    comando: "@coder"
    parole_chiave: [regex, "query sql", "una funzione", "script veloce"]

  ragionamento:
    agente: "⚡ Claude Haiku"
    modello: cloud-veloce
    costo: basso
    descrizione: solo se il locale non basta - testi lunghi e curati da inviare o pubblicare, traduzioni professionali, revisione accurata di documenti, codice di media difficoltà su più funzioni
    comando: "@haiku"

  codice_complesso:
    agente: "🧠 Claude"
    modello: cloud-codice
    costo: medio
    descrizione: compiti difficili - app o siti interi, architettura, refactoring multi-file, debug difficile, analisi e ragionamenti complessi
    comando: "@claude"
    parole_chiave: [architettura, refactoring, "intera app", "progetta", debug]

  massimo:
    agente: "🎓 Claude Opus"
    modello: cloud-top
    costo: alto
    descrizione: solo su richiesta esplicita dell'utente con il comando @opus
    comando: "@opus"
    solo_comando: true

  documenti_lunghi:
    agente: "📚 Gemini"
    modello: cloud-documenti
    costo: basso
    descrizione: riassunti e analisi di documenti o testi molto lunghi (decine di pagine)
    comando: "@gemini"

  immagine:
    agente: "🎨 ComfyUI (RunPod)"
    gestore: runpod
    workflow: immagine
    costo: basso
    descrizione: creare o generare un'immagine, un logo, un'illustrazione
    comando: "@immagine"
    parole_chiave: ["genera un'immagine", "crea un'immagine", "disegna", "illustrazione", "crea un logo"]

  video:
    agente: "🎬 Wan 2.2 (RunPod)"
    gestore: runpod_pubblico
    endpoint: wan-2-2-t2v-720
    parametri:
      size: "1280*720"
      duration: 5
      num_inference_steps: 30
      guidance: 5
      seed: -1
      enable_safety_checker: true
    costo: medio
    descrizione: creare o generare un video o un'animazione
    comando: "@video"
    parole_chiave: ["genera un video", "crea un video", "animazione", "clip video"]

# Istruzioni date a ogni agente prima della conversazione
istruzioni_sistema: |
  Sei un assistente di Neural Agorà Control, una piattaforma in cui un'IA "Capo"
  smista le richieste tra più agenti. Rispondi sempre in italiano, in modo chiaro
  e diretto. Quando scrivi codice, usa blocchi di codice con il linguaggio indicato.
  Non inventare funzioni o strumenti che non hai.
  Nella conversazione possono esserci risposte di altri agenti della piattaforma
  (riconoscibili dalla riga "Capo → …"), comprese immagini generate da ComfyUI:
  sono reali, usale come contesto e non scusarti per esse.

# Il Capo preferisce sempre gli agenti gratuiti: sceglie quelli a pagamento solo quando servono davvero
preferisci_gratis: true

# Categoria usata se la classificazione non è chiara
predefinita: chat
