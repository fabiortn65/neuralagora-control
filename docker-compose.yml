name: neuralagora-control

services:
  # Gateway unico verso tutti i modelli: alias, budget, log della spesa
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@db:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"   # pannello LiteLLM raggiungibile solo da questo PC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Database di LiteLLM: registra la spesa per modello e fa rispettare il budget
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Motore di ricerca per il Capo (gratuito, senza chiavi): raggiungibile solo dai container
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-cambiami}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped

  # Il Capo: classifica la richiesta e la smista
  capo:
    build: ./capo
    env_file: .env
    environment:
      LITELLM_URL: http://litellm:4000
      SEARXNG_URL: http://searxng:8080
    volumes:
      - ./capo/rules.yaml:/app/rules.yaml:ro
      - ./runpod/workflows:/app/workflows:ro
      - ./output:/app/output
    ports:
      - "8100:8100"
    depends_on:
      - litellm
      - searxng
    restart: unless-stopped

  # Interfaccia web
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      OPENAI_API_BASE_URLS: http://capo:8100/v1;http://litellm:4000/v1
      OPENAI_API_KEYS: ${CAPO_API_KEY:-capo};${LITELLM_MASTER_KEY}
      ENABLE_OLLAMA_API: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_NAME: Neural Agorà Control
    volumes:
      - ./data/open-webui:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - capo
    restart: unless-stopped

  # Facoltativo: Ollama dentro Docker (Linux con GPU NVIDIA).
  # Su Windows/Mac conviene installare Ollama normalmente.
  # Avvio: docker compose --profile ollama up -d  e in .env OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
